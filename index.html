<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plainsong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="side" id="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <g fill="currentColor">
          <rect x="2" y="10" width="3.4" height="6" rx="1.2" />
          <rect x="7.6" y="5" width="3.4" height="16" rx="1.2" />
          <rect x="13.2" y="8" width="3.4" height="10" rx="1.2" />
          <rect x="18.8" y="2" width="3.4" height="22" rx="1.2" />
        </g>
      </svg>
      <span>Plainsong</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-nav="home"><span data-ico="home"></span>Home</button>
      <button data-nav="explore"><span data-ico="compass"></span>Explore</button>
      <button data-nav="library"><span data-ico="library"></span>Library</button>
    </nav>
    <div class="side-sec">
      <div class="side-h"><span>Playlists</span><button class="icon-btn" data-act="newPlaylist"
          aria-label="New playlist"><span data-ico="plus" data-s="16"></span></button></div>
      <div id="sidePl"></div>
    </div>
    <div class="side-foot">
      <button class="btn primary" data-act="import"><span data-ico="upload" data-s="16"></span>Import music</button>
      <button class="btn" data-act="importDir"><span data-ico="folder" data-s="16"></span>Import folder</button>
      <div class="readout" id="libStat">0 songs</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden><span data-ico="back"></span></button>
      <form class="search" id="searchForm" role="search">
        <span data-ico="search" data-s="18"></span>
        <input id="q" type="search" placeholder="Search your library, Audius and the Internet Archive"
          aria-label="Search" autocomplete="off">
      </form>
      <span class="spacer"></span>
      <button class="icon-btn" data-act="import" aria-label="Import music" title="Import music"><span
          data-ico="upload"></span></button>
      <button class="icon-btn" data-act="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"><span
          style="font:600 15px var(--f-mono)">?</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme"></button>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <aside class="np" id="np" aria-label="Now playing">
    <div class="np-head">
      <div class="tabs" id="npTabs" role="tablist">
        <button data-tab="queue" class="on" role="tab">Up next</button>
        <button data-tab="lyrics" role="tab">Lyrics</button>
        <button data-tab="sound" role="tab">Sound</button>
      </div>
      <button class="icon-btn" id="npClose" aria-label="Close panel"><span data-ico="x"></span></button>
    </div>
    <div class="np-art">
      <div class="cover xl" id="npCover"></div>
    </div>
    <div class="np-meta">
      <div class="t" id="npTitle">Nothing playing</div>
      <div class="a" id="npArtist">Import music or browse online</div>
      <div class="src mono" id="npSrc"></div>
    </div>
    <canvas class="meter" id="meter" aria-hidden="true"></canvas>
    <div class="np-body" id="npBody"></div>
  </aside>

  <footer class="bar" id="bar">
    <div class="bar-track">
      <div class="cover" id="barCover" role="button" tabindex="0" aria-label="Open now playing">♪</div>
      <div class="meta" id="barMeta">
        <div class="t" id="barTitle">Nothing playing</div>
        <div class="a" id="barArtist">Import music or browse online</div>
      </div>
      <button class="icon-btn" id="likeBtn" aria-label="Like" aria-pressed="false"></button>
    </div>
    <div class="bar-mid">
      <div class="transport">
        <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false"></button>
        <button class="icon-btn" id="prevBtn" aria-label="Previous"></button>
        <button class="play-btn" id="playBtn" aria-label="Play"></button>
        <button class="icon-btn" id="nextBtn" aria-label="Next"></button>
        <button class="icon-btn" id="repeatBtn" aria-label="Repeat" aria-pressed="false"></button>
        <button class="icon-btn ab-btn" id="abBtn" aria-label="Set loop start" aria-pressed="false" title="Set loop start (A)">A–B</button>
      </div>
      <div class="seek">
        <span class="mono" id="tCur">0:00</span>
        <div class="seekwrap" id="seekWrap">
          <input class="rng" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <i class="abband" id="sbBand" hidden></i>
          <i class="abm a" id="sbA" hidden title="Loop start"></i>
          <i class="abm b" id="sbB" hidden title="Loop end"></i>
        </div>
        <span class="mono" id="tDur">0:00</span>
      </div>
    </div>
    <div class="bar-right">
      <button class="spd-btn" id="speedBtn" aria-label="Playback speed" aria-haspopup="true" aria-expanded="false" title="Playback speed ( [ and ] )">1×</button>
      <div class="vol">
        <button class="icon-btn" id="muteBtn" aria-label="Mute"></button>
        <input class="rng" id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <button class="icon-btn hide-s" id="lyricsBtn" aria-label="Lyrics" title="Lyrics"></button>
      <button class="icon-btn" id="npToggle" aria-label="Queue and now playing" title="Queue (Q)"></button>
    </div>
  </footer>

  <input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav" multiple hidden>
  <input type="file" id="dirIn" webkitdirectory multiple hidden>
  <div class="menu" id="menu" hidden></div>
  <div class="pop" id="speedPop" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="drop" id="drop" hidden>
    <div>Drop audio files or folders to add them to your library</div>
  </div>
  <dialog id="dlg"></dialog>
  <audio id="aL" preload="auto"></audio>
  <audio id="aW" preload="auto"></audio>

  <script>
    'use strict';

    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
    const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
    const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const bytes = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
    const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

    const P = {
      play: '<polygon points="7 4 20 12 7 20 7 4" fill="currentColor" stroke="none"/>',
      pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/>',
      next: '<polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/>',
      prev: '<polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="5" x2="5" y2="19"/>',
      shuffle: '<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
      repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
      heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
      heartOn: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>',
      vol: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
      mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
      queue: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      more: '<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
      library: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
      moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
      mic: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>',
      folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'
    };
    const ico = (n, s = 20) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;

    const DB = {
      ok: false, db: null,
      open() {
        return new Promise((res, rej) => {
          if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
          const r = indexedDB.open('plainsong', 1);
          r.onupgradeneeded = () => {
            const d = r.result;
            d.createObjectStore('tracks', { keyPath: 'id' }); d.createObjectStore('playlists', { keyPath: 'id' });
            d.createObjectStore('blobs'); d.createObjectStore('kv');
          };
          r.onsuccess = () => { this.db = r.result; this.ok = true; res(); };
          r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        });
      },
      req(store, mode, fn) {
        return new Promise((res, rej) => {
          if (!this.ok) return res(undefined);
          try {
            const tx = this.db.transaction(store, mode); const rq = fn(tx.objectStore(store));
            tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
          } catch (e) { rej(e); }
        });
      },
      all(s) { return this.req(s, 'readonly', o => o.getAll()).then(v => v || []); },
      get(s, k) { return this.req(s, 'readonly', o => o.get(k)); },
      put(s, v, k) { return this.req(s, 'readwrite', o => k === undefined ? o.put(v) : o.put(v, k)); },
      del(s, k) { return this.req(s, 'readwrite', o => o.delete(k)); }
    };
    const dbPut = (...a) => DB.put(...a).catch(() => { });
    const dbDel = (...a) => DB.del(...a).catch(() => { });

    const ascii = (b, o, n) => { let s = ''; for (let i = 0; i < n && o + i < b.length; i++) s += String.fromCharCode(b[o + i]); return s; };
    const syncsafe = (b, o) => (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3];
    function decodeText(b, enc) {
      let lbl = 'iso-8859-1';
      if (enc === 1) lbl = (b[0] === 0xFE && b[1] === 0xFF) ? 'utf-16be' : 'utf-16le';
      else if (enc === 2) lbl = 'utf-16be';
      else if (enc === 3) lbl = 'utf-8';
      return new TextDecoder(lbl).decode(b);
    }
    const cleanText = (b, enc) => decodeText(b, enc).split('\0').map(s => s.trim()).filter(Boolean).join(', ');
    function skipTerm(b, i, enc) {
      if (enc === 1 || enc === 2) { while (i + 1 < b.length && !(b[i] === 0 && b[i + 1] === 0)) i += 2; return i + 2; }
      while (i < b.length && b[i] !== 0) i++; return i + 1;
    }
    function parseAPIC(b, ver) {
      const enc = b[0]; let i = 1, mime;
      if (ver === 2) { mime = 'image/' + (ascii(b, 1, 3).toLowerCase() === 'png' ? 'png' : 'jpeg'); i = 4; }
      else { let e = i; while (e < b.length && b[e] !== 0) e++; mime = ascii(b, i, e - i) || 'image/jpeg'; if (mime === 'image/jpg') mime = 'image/jpeg'; i = e + 1; }
      i++; i = skipTerm(b, i, enc);
      return new Blob([b.subarray(i)], { type: mime });
    }
    function parseID3v2(b, ver, flags, out) {
      let p = 0;
      if (flags & 0x40 && b.length > 4) { p = ver === 4 ? syncsafe(b, 0) : (((b[0] << 24) | (b[1] << 16) | (b[2] << 8) | b[3]) >>> 0) + 4; }
      const hl = ver === 2 ? 6 : 10;
      while (p + hl <= b.length) {
        let id, size;
        if (ver === 2) { id = ascii(b, p, 3); size = (b[p + 3] << 16) | (b[p + 4] << 8) | b[p + 5]; }
        else { id = ascii(b, p, 4); size = ver === 4 ? syncsafe(b, p + 4) : (((b[p + 4] << 24) | (b[p + 5] << 16) | (b[p + 6] << 8) | b[p + 7]) >>> 0); }
        if (!id || id.charCodeAt(0) === 0 || size <= 0 || p + hl + size > b.length + 1) break;
        const body = b.subarray(p + hl, p + hl + size); p += hl + size;
        if (id === 'TIT2' || id === 'TT2') out.title = cleanText(body.subarray(1), body[0]);
        else if (id === 'TPE1' || id === 'TP1') out.artist = cleanText(body.subarray(1), body[0]);
        else if (id === 'TALB' || id === 'TAL') out.album = cleanText(body.subarray(1), body[0]);
        else if (id === 'TRCK' || id === 'TRK') out.track = parseInt(cleanText(body.subarray(1), body[0])) || 0;
        else if ((id === 'APIC' || id === 'PIC') && !out.coverBlob) { try { const bl = parseAPIC(body, ver); if (bl.size > 100) out.coverBlob = bl; } catch (e) { } }
        else if ((id === 'USLT' || id === 'ULT') && !out.lyrics) { try { const enc = body[0]; const i = skipTerm(body, 4, enc); out.lyrics = decodeText(body.subarray(i), enc).replace(/\0+$/, '').trim(); } catch (e) { } }
      }
    }
    async function readTags(file) {
      const out = {};
      try {
        const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
        if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) {
          const size = syncsafe(head, 6);
          const buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
          parseID3v2(buf, head[3], head[5], out);
        }
        if (!out.title && file.size > 128) {
          const t = new Uint8Array(await file.slice(file.size - 128).arrayBuffer());
          if (t[0] === 0x54 && t[1] === 0x41 && t[2] === 0x47) {
            const l1 = (o, n) => ascii(t, o, n).replace(/\0.*$/, '').trim();
            out.title = l1(3, 30); out.artist = out.artist || l1(33, 30); out.album = out.album || l1(63, 30);
          }
        }
      } catch (e) { }
      return out;
    }
    function parseLRC(txt) {
      const out = [];
      for (const line of String(txt || '').split(/\r?\n/)) {
        const m = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
        if (!m.length) continue;
        const text = line.replace(/\[[^\]]*\]/g, '').trim();
        for (const x of m) out.push({ t: +x[1] * 60 + parseFloat(x[2]), text });
      }
      return out.sort((a, b) => a.t - b.t);
    }
    const MIME = { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', flac: 'audio/flac', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', wav: 'audio/wav', weba: 'audio/webm' };
    const AUDIO_RE = /\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|weba|wma)$/i;
    function fromName(name) {
      let s = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').replace(/^\s*\d{1,3}\s*[.\-_)]\s*/, '').trim();
      const i = s.indexOf(' - ');
      return i > 0 ? { artist: s.slice(0, i).trim(), title: s.slice(i + 3).trim() } : { artist: '', title: s };
    }
    async function makeCover(blob) {
      try {
        const bmp = await createImageBitmap(blob); const k = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .82);
      } catch (e) { return ''; }
    }
    function probeDuration(blob) {
      return new Promise(res => {
        const a = new Audio(), u = URL.createObjectURL(blob); let done = false;
        const fin = v => { if (done) return; done = true; URL.revokeObjectURL(u); a.removeAttribute('src'); try { a.load(); } catch (e) { } res(v); };
        a.preload = 'metadata'; a.onloadedmetadata = () => fin(isFinite(a.duration) ? a.duration : 0); a.onerror = () => fin(0);
        setTimeout(() => fin(0), 6000); a.src = u;
      });
    }

    const S = {
      tracks: new Map(),
      cache: new Map(),
      mem: new Map(),
      playlists: [], hist: [],
      queue: [], orig: [], qi: -1, cur: null, shuffle: false, repeat: 0,
      vol: .8, muted: false, rate: 1, pitch: true, ab: { a: null, b: null }, eq: Array(10).fill(0), eqPreset: 'Flat',
      view: { name: 'home' }, stack: [], lists: [], vtok: 0, npTab: 'queue',
      sleep: null, counted: false, seeking: false, loadTok: 0, errCount: 0, lastSave: 0, resume: null, objUrl: null,
      lyr: { id: null, lines: [], idx: -1 }, archTracks: []
    };

    async function removeTrack(id) {
      const t = S.tracks.get(id); if (!t) return;
      if (!await confirmBox(`Remove “${t.title}” from your library?`, 'Remove')) return;
      S.tracks.delete(id); S.mem.delete(id);
      await dbDel('tracks', id); await dbDel('blobs', id);
      S.playlists.forEach(p => { if (p.ids.includes(id)) { p.ids = p.ids.filter(x => x !== id); dbPut('playlists', p); } });
      if (t.kind === 'web') S.cache.set(id, t); else purgeFromQueue(id);
      libStat(); refresh(); toast('Removed from library');
    }

    const tidOf = a => { const r = a.closest('[data-tid]'); return r && r.dataset.tid; };
    async function handleAct(a, e) {
      const d = a.dataset;
      switch (d.act) {
        case 'import': $('#fileIn').click(); break;
        case 'importDir': $('#dirIn').click(); break;
        case 'like': toggleLike(tidOf(a)); break;
        case 'more': { const r = a.getBoundingClientRect(); const c = a.closest('[data-ctx]'); openTrackMenu(tidOf(a), r.right, r.bottom, c ? c.dataset.ctx : ''); break; }
        case 'playList': { const ids = S.lists[+d.list]; if (ids && ids.length) playList(ids, 0, { shuffle: !!d.shuffle }); break; }
        case 'libTab': S.view.tab = d.tab; render(); break;
        case 'openAlbum': go('album', { key: d.key }); break;
        case 'openArtist': go('artist', { key: d.key }); break;
        case 'openPlaylist': go('playlist', { id: d.id }); break;
        case 'openArch': go('arch', { id: d.id }); break;
        case 'goExplore': go('explore', {}); break;
        case 'newPlaylist': { const pl = await newPlaylist(); if (pl) go('playlist', { id: pl.id }); break; }
        case 'genre': S.view.genre = d.v; render(true); break;
        case 'archPick': S.view.pick = +d.v; render(true); break;
        case 'searchSrc': S.view.src = d.v; render(); break;
        case 'retry': render(true); break;
        case 'help': showHelp(); break;
        case 'saveAll': { S.archTracks.forEach(saveWeb); toast(`Saved ${S.archTracks.length} songs to your library`); break; }
        case 'plRename': { const pl = S.playlists.find(p => p.id === d.id); if (!pl) break; const n = await askText('Rename playlist', pl.name, 'Rename'); if (n) { pl.name = n; dbPut('playlists', pl); renderSide(); render(true); } break; }
        case 'plDelete': { const pl = S.playlists.find(p => p.id === d.id); if (!pl) break; if (await confirmBox(`Delete the playlist “${pl.name}”? The songs stay in your library.`, 'Delete')) { S.playlists = S.playlists.filter(p => p.id !== pl.id); dbDel('playlists', pl.id); renderSide(); S.stack = []; S.view = { name: 'library', tab: 'playlists' }; render(); } break; }
        case 'qrm': removeFromQueue(+a.closest('[data-qi]').dataset.qi); break;
        case 'qclear': { const cur = S.queue[S.qi]; S.queue = cur ? [cur] : []; S.orig = S.queue.slice(); S.qi = cur ? 0 : -1; renderNP(); saveSession(); break; }
        case 'qsave': { const ids = uniq(S.queue); if (!ids.length) break; const stamp = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); const pl = await newPlaylistNamed(`Queue ${stamp}`, ids); if (pl) toast(`Saved as “${pl.name}”`); break; }
        case 'rate': setRate(+d.v); break;
        case 'rateReset': setRate(1); break;
        case 'abSet': abSet(d.w); break;
        case 'abClear': abReset(); break;
        case 'abNudge': abNudge(d.w, +d.dt); break;
        case 'sleep': setSleep(d.v === 'end' ? 'end' : +d.v); break;
      }
    }
    async function newPlaylistNamed(def, ids) {
      const name = await askText('Save queue as playlist', def, 'Save'); if (!name) return null;
      const pl = { id: uid(), name, ids: [], created: Date.now() };
      ids.forEach(id => { const t = T(id); if (t) { saveWeb(t); pl.ids.push(id); } });
      S.playlists.push(pl); await dbPut('playlists', pl); renderSide(); return pl;
    }
    function playFromList(row) {
      const holder = row.closest('[data-list]'); if (!holder) return;
      const ids = S.lists[+holder.dataset.list], i = +row.dataset.i; if (!ids || !ids[i]) return;
      if (S.cur === ids[i]) { togglePlay(); return; }
      playList(ids, i);
    }
    document.addEventListener('click', e => {
      if (!e.target.closest('#menu')) closeMenu();
      const mi = e.target.closest('[data-mi]');
      if (mi) { const it = $('#menu')._items && $('#menu')._items[+mi.dataset.mi]; if (it) { const keep = it.fn(); if (keep !== 'keep') closeMenu(); } return; }
      const a = e.target.closest('[data-act]'); if (a) { handleAct(a, e); return; }
      const q = e.target.closest('.qrow[data-qi]'); if (q) { jump(+q.dataset.qi); return; }
      const ll = e.target.closest('.ll[data-t]'); if (ll) { A.currentTime = +ll.dataset.t; return; }
      const r = e.target.closest('[data-tid][data-i]'); if (r) playFromList(r);
    });
    document.addEventListener('keydown', e => {
      const tg = e.target, typing = tg.matches && tg.matches('input,textarea,select');
      if (e.key === 'Escape') { closeMenu(); closeSpeed(); return; }
      if (e.key === 'Enter' && tg.matches && tg.matches('.row[tabindex],.card[tabindex]')) { e.preventDefault(); tg.click(); return; }
      if (e.key === 'Enter' && tg.id === 'barCover') { toggleNP(true); return; }
      if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key;
      if (k === ' ') { if (tg.matches && tg.matches('button,a')) return; e.preventDefault(); togglePlay(); }
      else if (k === 'ArrowRight') { if (e.shiftKey) advance(1, false); else A.currentTime = Math.min((A.duration || 1e9), A.currentTime + 5); }
      else if (k === 'ArrowLeft') { if (e.shiftKey) advance(-1, false); else A.currentTime = Math.max(0, A.currentTime - 5); }
      else if (k === 'ArrowUp') { e.preventDefault(); S.vol = clamp(S.vol + .05, 0, 1); S.muted = false; applyVol(); saveSession(); }
      else if (k === 'ArrowDown') { e.preventDefault(); S.vol = clamp(S.vol - .05, 0, 1); applyVol(); saveSession(); }
      else if (k === 'm' || k === 'M') { S.muted = !S.muted; applyVol(); }
      else if (k === 'l' || k === 'L') { if (S.cur) toggleLike(S.cur); }
      else if (k === 's' || k === 'S') toggleShuffle();
      else if (k === 'r' || k === 'R') cycleRepeat();
      else if (k === 'q' || k === 'Q') toggleNP();
      else if (k === '/') { e.preventDefault(); $('#q').focus(); }
      else if (k === 'a' || k === 'A') abCycle();
      else if (k === '[') { setRate(S.rate - .05); toast(rateTxt(S.rate), 900); }
      else if (k === ']') { setRate(S.rate + .05); toast(rateTxt(S.rate), 900); }
      else if (k === '\\') { setRate(1); toast('Normal speed', 900); }
      else if (k === '?') showHelp();
    });

    $('#playBtn').onclick = togglePlay;
    $('#nextBtn').onclick = () => advance(1, false);
    $('#prevBtn').onclick = () => advance(-1, false);
    $('#shuffleBtn').onclick = toggleShuffle;
    $('#repeatBtn').onclick = cycleRepeat;
    $('#abBtn').onclick = abCycle;
    $('#speedBtn').onclick = toggleSpeed;
    document.addEventListener('click', e => { if (!e.target.closest('#speedPop,#speedBtn')) closeSpeed(); });
    $('#likeBtn').onclick = () => { if (S.cur) toggleLike(S.cur); };
    $('#muteBtn').onclick = () => { S.muted = !S.muted; applyVol(); saveSession(); };
    $('#vol').addEventListener('input', e => { S.vol = +e.target.value / 100; S.muted = false; applyVol(); saveSession(); });
    $('#npToggle').onclick = () => toggleNP();
    $('#npClose').onclick = () => toggleNP(false);
    $('#lyricsBtn').onclick = () => { if (document.body.classList.contains('np-open') && S.npTab === 'lyrics') toggleNP(false); else setTab('lyrics', true); };
    $('#barCover').onclick = () => toggleNP(true);
    $('#barMeta').onclick = () => toggleNP(true);
    $('#npTabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
    $('#backBtn').onclick = back;
    $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (!b) return; S.stack = []; S.view = { name: b.dataset.nav }; render(); });
    $('#searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) go('search', { q }, S.view.name !== 'search'); });
    const seekEl = $('#seek');
    seekEl.addEventListener('input', () => { S.seeking = true; const t = curT(); const d = isFinite(A.duration) && A.duration > 0 ? A.duration : (t && t.duration) || 0; $('#tCur').textContent = fmt(seekEl.value / 1000 * d); seekEl.style.setProperty('--p', (seekEl.value / 10) + '%'); });
    seekEl.addEventListener('change', () => { const t = curT(); const d = isFinite(A.duration) && A.duration > 0 ? A.duration : (t && t.duration) || 0; if (d) A.currentTime = seekEl.value / 1000 * d; S.seeking = false; });
    $('#fileIn').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
    $('#dirIn').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.id === 'libFilter') { S.view.filter = t.value; fillSongs(); }
      else if (t.classList && t.classList.contains('spd-slider')) { setRate(+t.value); }
      else if (t.dataset && t.dataset.eq !== undefined) {
        const i = +t.dataset.eq; S.eq[i] = +t.value; if (G) G.bands[i].gain.value = S.eq[i];
        const lab = $('#ev' + i); if (lab) lab.textContent = (S.eq[i] > 0 ? '+' : '') + S.eq[i];
        S.eqPreset = 'Custom'; const sel = $('#eqPreset'); if (sel) { if (![...sel.options].some(o => o.value === 'Custom')) sel.add(new Option('Custom')); sel.value = 'Custom'; }
        saveSession();
      }
    });
    document.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'libSort') { S.view.sort = t.value; fillSongs(); }
      else if (t.classList && t.classList.contains('spd-pitch')) { S.pitch = t.checked; applyRate(); syncSpeed(); saveSession(); }
      else if (t.id === 'eqPreset' && EQ_PRESETS[t.value]) {
        S.eqPreset = t.value; S.eq = EQ_PRESETS[t.value].slice(); applyEq(); renderNP(); saveSession();
      }
    });
    const npBody = $('#npBody'); let dragI = -1;
    npBody.addEventListener('dragstart', e => { const r = e.target.closest('.qrow'); if (!r) return; dragI = +r.dataset.qi; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragI)); });
    npBody.addEventListener('dragover', e => { const r = e.target.closest('.qrow'); if (!r || dragI < 0) return; e.preventDefault(); $$('.qrow.over').forEach(x => x.classList.remove('over')); r.classList.add('over'); });
    npBody.addEventListener('drop', e => { const r = e.target.closest('.qrow'); if (!r || dragI < 0) return; e.preventDefault(); moveQueue(dragI, +r.dataset.qi); dragI = -1; });
    npBody.addEventListener('dragend', () => { dragI = -1; $$('.qrow.over').forEach(x => x.classList.remove('over')); });

    const hasFiles = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
    addEventListener('dragenter', e => { if (hasFiles(e)) $('#drop').hidden = false; });
    addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    addEventListener('dragleave', e => { if (e.relatedTarget === null) $('#drop').hidden = true; });
    addEventListener('drop', async e => { if (!hasFiles(e)) return; e.preventDefault(); $('#drop').hidden = true; const files = await collectDrop(e.dataTransfer); importFiles(files); });

    const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
    function themeIcon() { $('#themeBtn').innerHTML = ico(isDark() ? 'sun' : 'moon'); readLeds(); paintMeter(); }
    $('#themeBtn').onclick = () => { const n = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = n; store.set('ps-theme', n); themeIcon(); };
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon);
    new ResizeObserver(() => document.documentElement.style.setProperty('--bar-h', $('#bar').offsetHeight + 'px')).observe($('#bar'));

    function restore(ss) {
      S.vol = ss.vol == null ? .8 : ss.vol; S.muted = !!ss.muted; S.rate = ss.rate || 1; S.pitch = ss.pitch !== false;
      S.eq = ss.eq && ss.eq.length === 10 ? ss.eq : Array(10).fill(0); S.eqPreset = ss.eqPreset || 'Flat';
      S.shuffle = !!ss.shuffle; S.repeat = ss.repeat || 0; S.npTab = ss.npTab || 'queue';
      (ss.webs || []).forEach(w => S.cache.set(w.id, w));
      const curId = (ss.queue || [])[ss.qi];
      S.queue = (ss.queue || []).filter(id => T(id)); S.orig = (ss.orig || S.queue).filter(id => T(id));
      S.qi = S.queue.length ? Math.max(0, S.queue.indexOf(curId)) : -1;
      applyVol(); applyRate(); syncSpeed(); syncModes();
      $$('#npTabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.npTab));
      if (S.queue.length) { S.resume = ss.time || 0; loadCurrent(false); }
      if (ss.np && innerWidth > 1100) document.body.classList.add('np-open');
    }
    (async function boot() {
      $$('[data-ico]').forEach(el => { el.innerHTML = ico(el.dataset.ico, +el.dataset.s || 20); });
      $('#shuffleBtn').innerHTML = ico('shuffle'); $('#prevBtn').innerHTML = ico('prev'); $('#playBtn').innerHTML = ico('play', 22); $('#nextBtn').innerHTML = ico('next');
      $('#repeatBtn').innerHTML = ico('repeat'); $('#lyricsBtn').innerHTML = ico('mic'); $('#npToggle').innerHTML = ico('queue'); $('#likeBtn').innerHTML = ico('heart');
      const th = store.get('ps-theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
      themeIcon(); applyVol(); syncModes(); syncLikeBtn();
      try { await DB.open(); } catch (e) { toast('This browser mode can’t save a library, so imports last only for this visit.', 7000); }
      if (DB.ok) {
        try {
          const [tracks, pls, hist, ss] = await Promise.all([DB.all('tracks'), DB.all('playlists'), DB.get('kv', 'hist'), DB.get('kv', 'session')]);
          tracks.forEach(t => S.tracks.set(t.id, t));
          S.playlists = pls.sort((a, b) => (a.created || 0) - (b.created || 0)); S.hist = hist || [];
          S.hist.forEach(h => { if (h.snap && !T(h.id)) S.cache.set(h.id, h.snap); });
          if (ss) restore(ss);
        } catch (e) { }
      }
      renderSide(); libStat(); render();
      if (document.body.classList.contains('np-open')) { renderNP(); setTimeout(() => { sizeMeter(); startMeter(); }, 260); }
    })();

  </script>
</body>

</html>
