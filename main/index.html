<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plainsong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="side" id="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <g fill="currentColor">
          <rect x="2" y="10" width="3.4" height="6" rx="1.2" />
          <rect x="7.6" y="5" width="3.4" height="16" rx="1.2" />
          <rect x="13.2" y="8" width="3.4" height="10" rx="1.2" />
          <rect x="18.8" y="2" width="3.4" height="22" rx="1.2" />
        </g>
      </svg>
      <span>Plainsong</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-nav="home"><span data-ico="home"></span>Home</button>
      <button data-nav="explore"><span data-ico="compass"></span>Explore</button>
      <button data-nav="library"><span data-ico="library"></span>Library</button>
    </nav>
    <div class="side-sec">
      <div class="side-h"><span>Playlists</span><button class="icon-btn" data-act="newPlaylist"
          aria-label="New playlist"><span data-ico="plus" data-s="16"></span></button></div>
      <div id="sidePl"></div>
    </div>
    <div class="side-foot">
      <button class="btn primary" data-act="import"><span data-ico="upload" data-s="16"></span>Import music</button>
      <button class="btn" data-act="importDir"><span data-ico="folder" data-s="16"></span>Import folder</button>
      <button class="btn" data-act="backup"><span data-ico="download" data-s="16"></span>Back up library</button>
      <button class="btn" data-act="restore"><span data-ico="restore" data-s="16"></span>Restore from backup…</button>
      <div class="readout" id="libStat">0 songs</div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden><span data-ico="back"></span></button>
      <form class="search" id="searchForm" role="search">
        <span data-ico="search" data-s="18"></span>
        <input id="q" type="search" placeholder="Search your library, Audius and the Internet Archive"
          aria-label="Search" autocomplete="off">
      </form>
      <span class="spacer"></span>
      <button class="icon-btn" data-act="import" aria-label="Import music" title="Import music"><span
          data-ico="upload"></span></button>
      <button class="icon-btn" data-act="backup" aria-label="Back up library" title="Back up library"><span
          data-ico="download"></span></button>
      <button class="icon-btn" data-act="restore" aria-label="Restore from backup" title="Restore from backup"><span
          data-ico="restore"></span></button>
      <button class="icon-btn" data-act="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"><span
          style="font:600 15px var(--f-mono)">?</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme"></button>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <aside class="np" id="np" aria-label="Now playing">
    <div class="np-head">
      <div class="tabs" id="npTabs" role="tablist">
        <button data-tab="queue" class="on" role="tab">Up next</button>
        <button data-tab="lyrics" role="tab">Lyrics</button>
        <button data-tab="sound" role="tab">Sound</button>
      </div>
      <button class="icon-btn" id="npClose" aria-label="Close panel"><span data-ico="x"></span></button>
    </div>
    <div class="np-art">
      <div class="cover xl" id="npCover"></div>
    </div>
    <div class="np-meta">
      <div class="t" id="npTitle">Nothing playing</div>
      <div class="a" id="npArtist">Import music or browse online</div>
      <div class="src mono" id="npSrc"></div>
    </div>
    <canvas class="meter" id="meter" aria-hidden="true"></canvas>
    <div class="np-body" id="npBody"></div>
  </aside>

  <footer class="bar" id="bar">
    <div class="bar-track">
      <div class="cover" id="barCover" role="button" tabindex="0" aria-label="Open now playing">♪</div>
      <div class="meta" id="barMeta">
        <div class="t" id="barTitle">Nothing playing</div>
        <div class="a" id="barArtist">Import music or browse online</div>
      </div>
      <button class="icon-btn" id="likeBtn" aria-label="Like" aria-pressed="false"></button>
    </div>
    <div class="bar-mid">
      <div class="transport">
        <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false"></button>
        <button class="icon-btn" id="prevBtn" aria-label="Previous"></button>
        <button class="play-btn" id="playBtn" aria-label="Play"></button>
        <button class="icon-btn" id="nextBtn" aria-label="Next"></button>
        <button class="icon-btn" id="repeatBtn" aria-label="Repeat" aria-pressed="false"></button>
        <button class="icon-btn ab-btn" id="abBtn" aria-label="Set loop start" aria-pressed="false" title="Set loop start (A)">A–B</button>
      </div>
      <div class="seek">
        <span class="mono" id="tCur">0:00</span>
        <div class="seekwrap" id="seekWrap">
          <input class="rng" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <i class="abband" id="sbBand" hidden></i>
          <i class="abm a" id="sbA" hidden title="Loop start"></i>
          <i class="abm b" id="sbB" hidden title="Loop end"></i>
        </div>
        <span class="mono" id="tDur">0:00</span>
      </div>
    </div>
    <div class="bar-right">
      <button class="spd-btn" id="speedBtn" aria-label="Playback speed" aria-haspopup="true" aria-expanded="false" title="Playback speed ( [ and ] )">1×</button>
      <div class="vol">
        <button class="icon-btn" id="muteBtn" aria-label="Mute"></button>
        <input class="rng" id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <button class="icon-btn hide-s" id="lyricsBtn" aria-label="Lyrics" title="Lyrics"></button>
      <button class="icon-btn" id="npToggle" aria-label="Queue and now playing" title="Queue (Q)"></button>
    </div>
  </footer>

  <input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav" multiple hidden>
  <input type="file" id="dirIn" webkitdirectory multiple hidden>
  <input type="file" id="restoreIn" accept=".zip,application/zip,application/x-zip-compressed" hidden>
  <div class="menu" id="menu" hidden></div>
  <div class="pop" id="speedPop" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="drop" id="drop" hidden>
    <div>Drop audio files or folders to add them to your library</div>
  </div>
  <dialog id="dlg"></dialog>
  <audio id="aL" preload="auto"></audio>
  <audio id="aW" preload="auto"></audio>

  <script>
    'use strict';

    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
    const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
    const debounce = (f, ms) => { let t = 0; const d = (...a) => { clearTimeout(t); t = setTimeout(() => { t = 0; f(...a); }, ms); }; d.pending = () => !!t; d.cancel = () => { clearTimeout(t); t = 0; }; return d; };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const bytes = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
    const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

    const P = {
      play: '<polygon points="7 4 20 12 7 20 7 4" fill="currentColor" stroke="none"/>',
      pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/>',
      next: '<polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/>',
      prev: '<polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="5" x2="5" y2="19"/>',
      shuffle: '<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>',
      repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
      heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
      heartOn: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>',
      vol: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
      mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
      queue: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      more: '<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
      library: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
      moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
      mic: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>',
      folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
      restore: '<path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/>',
      save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'
    };
    const ico = (n, s = 20) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;

    const DB = {
      ok: false, db: null, lock: false,
      open() {
        return new Promise((res, rej) => {
          if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
          const r = indexedDB.open('plainsong', 1);
          r.onupgradeneeded = () => {
            const d = r.result;
            d.createObjectStore('tracks', { keyPath: 'id' }); d.createObjectStore('playlists', { keyPath: 'id' });
            d.createObjectStore('blobs'); d.createObjectStore('kv');
          };
          r.onsuccess = () => { this.db = r.result; this.ok = true; res(); };
          r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        });
      },
      req(store, mode, fn) {
        return new Promise((res, rej) => {
          if (!this.ok) return res(undefined);
          if (this.lock && mode !== 'readonly') return rej(new Error('Writes are paused while a backup file is being restored'));
          try {
            const tx = this.db.transaction(store, mode); const rq = fn(tx.objectStore(store));
            tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
          } catch (e) { rej(e); }
        });
      },
      all(s) { return this.req(s, 'readonly', o => o.getAll()).then(v => v || []); },
      get(s, k) { return this.req(s, 'readonly', o => o.get(k)); },
      put(s, v, k) { return this.req(s, 'readwrite', o => k === undefined ? o.put(v) : o.put(v, k)); },
      del(s, k) { return this.req(s, 'readwrite', o => o.delete(k)); }
    };
    const dbPut = (...a) => DB.put(...a).catch(() => { });
    const dbDel = (...a) => DB.del(...a).catch(() => { });
    /* ---- per-track write coordination (Phase 3B review fix) ----
       IndexedDB takes its snapshot of a record when put() is CALLED, and every writer of a song (likes, play counter, duration, lyrics, the info editor, the cover editor,
       removal) shares the one in-memory record. So all writes of ONE track id run strictly one after another, and a queued writer takes its snapshot when it RUNS (not when it was
       queued): it then sees every earlier change that actually committed and nothing that failed. The info/cover editors do not touch the shared record before their write is durable:
       they put a CLONE carrying only their own fields, then apply just those fields to the shared record. A failed write therefore leaves nothing to undo, and no other writer's
       snapshot can carry an uncommitted field. Different tracks never wait for each other. */
    const trackQ = new Map();
    function trackWrite(id, task) {
      const prev = trackQ.get(id);
      const p = prev ? prev.then(task) : task();   // idle queue: runs immediately (same timing as before); busy: strictly after the earlier writes settled
      const tail = Promise.resolve(p).then(() => { }, () => { });
      trackQ.set(id, tail); tail.then(() => { if (trackQ.get(id) === tail) trackQ.delete(id); });
      return p;
    }
    // a plain whole-record write (like, play counter, duration, lyrics, a new web song): snapshot at execution; skipped if the song was removed or the library replaced meanwhile
    const dbPutTrack = t => trackWrite(t.id, async () => { if (S.tracks.get(t.id) !== t) return; await DB.put('tracks', t); }).catch(() => { });
    // a queued delete belongs to the library that existed when the song was removed: if a restore replaced the library (epoch changed) while it waited behind an earlier write, it must NOT run (resolves true only when the delete ran)
    const dbDelTrack = (id, epoch) => trackWrite(id, async () => { if (epoch !== S.epoch) return false; await DB.del('tracks', id); return true; }).catch(() => false);

    const ascii = (b, o, n) => { let s = ''; for (let i = 0; i < n && o + i < b.length; i++) s += String.fromCharCode(b[o + i]); return s; };
    const syncsafe = (b, o) => (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3];
    function decodeText(b, enc) {
      let lbl = 'iso-8859-1';
      if (enc === 1) lbl = (b[0] === 0xFE && b[1] === 0xFF) ? 'utf-16be' : 'utf-16le';
      else if (enc === 2) lbl = 'utf-16be';
      else if (enc === 3) lbl = 'utf-8';
      return new TextDecoder(lbl).decode(b);
    }
    const cleanText = (b, enc) => decodeText(b, enc).split('\0').map(s => s.trim()).filter(Boolean).join(', ');
    function skipTerm(b, i, enc) {
      if (enc === 1 || enc === 2) { while (i + 1 < b.length && !(b[i] === 0 && b[i + 1] === 0)) i += 2; return i + 2; }
      while (i < b.length && b[i] !== 0) i++; return i + 1;
    }
    function parseAPIC(b, ver) {
      const enc = b[0]; let i = 1, mime;
      if (ver === 2) { mime = 'image/' + (ascii(b, 1, 3).toLowerCase() === 'png' ? 'png' : 'jpeg'); i = 4; }
      else { let e = i; while (e < b.length && b[e] !== 0) e++; mime = ascii(b, i, e - i) || 'image/jpeg'; if (mime === 'image/jpg') mime = 'image/jpeg'; i = e + 1; }
      i++; i = skipTerm(b, i, enc);
      return new Blob([b.subarray(i)], { type: mime });
    }
    function parseID3v2(b, ver, flags, out) {
      let p = 0;
      if (flags & 0x40 && b.length > 4) { p = ver === 4 ? syncsafe(b, 0) : (((b[0] << 24) | (b[1] << 16) | (b[2] << 8) | b[3]) >>> 0) + 4; }
      const hl = ver === 2 ? 6 : 10;
      while (p + hl <= b.length) {
        let id, size;
        if (ver === 2) { id = ascii(b, p, 3); size = (b[p + 3] << 16) | (b[p + 4] << 8) | b[p + 5]; }
        else { id = ascii(b, p, 4); size = ver === 4 ? syncsafe(b, p + 4) : (((b[p + 4] << 24) | (b[p + 5] << 16) | (b[p + 6] << 8) | b[p + 7]) >>> 0); }
        if (!id || id.charCodeAt(0) === 0 || size <= 0 || p + hl + size > b.length + 1) break;
        const body = b.subarray(p + hl, p + hl + size); p += hl + size;
        if (id === 'TIT2' || id === 'TT2') out.title = cleanText(body.subarray(1), body[0]);
        else if (id === 'TPE1' || id === 'TP1') out.artist = cleanText(body.subarray(1), body[0]);
        else if (id === 'TALB' || id === 'TAL') out.album = cleanText(body.subarray(1), body[0]);
        else if (id === 'TRCK' || id === 'TRK') out.track = parseInt(cleanText(body.subarray(1), body[0])) || 0;
        else if ((id === 'APIC' || id === 'PIC') && !out.coverBlob) { try { const bl = parseAPIC(body, ver); if (bl.size > 100) out.coverBlob = bl; } catch (e) { } }
        else if ((id === 'USLT' || id === 'ULT') && !out.lyrics) { try { const enc = body[0]; const i = skipTerm(body, 4, enc); out.lyrics = decodeText(body.subarray(i), enc).replace(/\0+$/, '').trim(); } catch (e) { } }
      }
    }
    async function readTags(file) {
      const out = {};
      try {
        const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
        if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) {
          const size = syncsafe(head, 6);
          const buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
          parseID3v2(buf, head[3], head[5], out);
        }
        if (!out.title && file.size > 128) {
          const t = new Uint8Array(await file.slice(file.size - 128).arrayBuffer());
          if (t[0] === 0x54 && t[1] === 0x41 && t[2] === 0x47) {
            const l1 = (o, n) => ascii(t, o, n).replace(/\0.*$/, '').trim();
            out.title = l1(3, 30); out.artist = out.artist || l1(33, 30); out.album = out.album || l1(63, 30);
          }
        }
      } catch (e) { }
      return out;
    }
    function parseLRC(txt) {

      $('#repeatBtn').innerHTML = ico('repeat'); $('#lyricsBtn').innerHTML = ico('mic'); $('#npToggle').innerHTML = ico('queue'); $('#likeBtn').innerHTML = ico('heart');
      const th = store.get('ps-theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
      themeIcon(); applyVol(); syncModes(); syncLikeBtn();
      try { await DB.open(); } catch (e) { toast('This browser mode can’t save a library, so imports last only for this visit.', 7000); }
      if (DB.ok) await hydrate();
      renderSide(); libStat(); render();
      if (document.body.classList.contains('np-open')) { renderNP(); setTimeout(() => { sizeMeter(); startMeter(); }, 260); }
    })();

  </script>
</body>
